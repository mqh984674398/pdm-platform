name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_contracts.py

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: pdm
          POSTGRES_DB: pdmtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Adapter tests seed this database, then connect read-only (T009).
      PDM_TEST_PG_URL: postgresql+psycopg://pdm:pdm@localhost:5432/pdmtest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Studio end-to-end tests run against the backend on the simulated source (T011).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../backend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PDM_PYTHON: python

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e "./backend[dev]"
      - run: cd frontend && npm ci
      - run: tools/check_schema_drift.sh python
